# Android Kernel (google/tensynos) 构建工作流
#
# 说明：
#   - 使用 kernel.org crosstool GCC 14.2.0 交叉工具链（x86_64-gcc-14.2.0-nolibc-aarch64-linux）
#   - 递归 checkout 子模块（KernelSU / v4l2loopback / fs/ntfs 等被 defconfig 引用，
#     drivers/kernelsu 是指向 KernelSU/kernel 的软链，缺少子模块会导致 make defconfig 失败）
#   - 产物：Image / Image.lz4 / Image.gz / dtb / 内核模块 / System.map（可选用 vmlinux）
#
# 触发方式：
#   - push 到 main / master / KernelSU：按 DEFCONFIG 默认值（zumapro_defconfig）构建
#   - 手动触发（workflow_dispatch）：可选择设备 defconfig 与 make 目标

name: Build Kernel (tensynos)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 设备 defconfig（zuma=Pixel 8 系列, zumapro=Pixel 9 系列, gs201=Pixel 7 系列）
        type: choice
        required: true
        default: zumapro_defconfig
        options:
          - zuma_defconfig
          - zumapro_defconfig
          - gs201_defconfig
          - gki_defconfig
      make_goals:
        description: 'make 目标（空格分隔）。注意：GKI 配置禁用模块（CONFIG_MODULES=n），modules 目标会报错'
        type: string
        required: false
        default: "Image.lz4 Image.gz dtbs"
      upload_vmlinux:
        description: 是否上传 vmlinux（含调试符号，体积较大）
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master, KernelSU]

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-
  GCC_VERSION: "14.2.0"
  DEFCONFIG: zumapro_defconfig
  MAKE_GOALS: "Image.lz4 Image.gz dtbs"

jobs:
  build:
    name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.defconfig || 'zumapro_defconfig' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          # 子模块均为公开仓库，无需 token；若之后改为私有子模块，
          # 需在此传入具有读取权限的 PAT。

      - name: 应用手动触发的构建参数
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "DEFCONFIG=${{ inputs.defconfig }}" >> "$GITHUB_ENV"
          echo "MAKE_GOALS=${{ inputs.make_goals }}" >> "$GITHUB_ENV"

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            flex bison bc cpio kmod \
            libssl-dev libelf-dev libncurses-dev libfl-dev \
            lz4 xz-utils zstd \
            dwarves \
            python3 ca-certificates curl
          # dwarves(pahole) 仅在启用 CONFIG_DEBUG_INFO_BTF 时需要，装上以防 defconfig 变动

      - name: 下载 GCC 14.2.0 交叉工具链
        run: |
          mkdir -p "$HOME/toolchain/gcc"
          curl -fL --retry 3 --retry-delay 5 \
            "https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/${GCC_VERSION}/x86_64-gcc-${GCC_VERSION}-nolibc-aarch64-linux.tar.xz" \
            -o /tmp/gcc.tar.xz
          tar -xJf /tmp/gcc.tar.xz -C "$HOME/toolchain/gcc"
          rm -f /tmp/gcc.tar.xz
          GCC_BIN="$HOME/toolchain/gcc/gcc-${GCC_VERSION}-nolibc/aarch64-linux/bin"
          # GITHUB_PATH 只在后续步骤生效，当前步骤内需用完整路径验证
          echo "$GCC_BIN" >> "$GITHUB_PATH"
          "$GCC_BIN/aarch64-linux-gcc" --version | head -n 1

      - name: 生成 .config
        run: |
          make "$DEFCONFIG"
          # 注意：本内核 Makefile 设置了 KBUILD_OUTPUT=out，产物与 .config 都在 out/ 下
          # 关键：defconfig 有 163 个 =m 模块（含显示驱动），但直接 make 环境没有 AOSP 的
          # CONFIG_MODULES=y + vendor_dlkm 流程 —— CONFIG_MODULES 默认 n 时这些驱动不会编译，
          # 导致显示等驱动缺失（hwc 报错/卡系统界面）。这里强制全部内建（=y）。
          sed -i 's/=m$/=y/' out/.config
          make olddefconfig
          echo "--- 关键配置检查 ---"
          grep -E "^CONFIG_MODULES|^CONFIG_GS_DRM_PANEL_UNIFIED|^CONFIG_DRM_PANEL_SAMSUNG" out/.config || true
          grep -E "^CONFIG_LOCALVERSION|^CONFIG_KSU" out/.config || true

      - name: 修复子模块兼容问题并放宽警告
        run: |
          # linux-ntfs 上游 bug：6.1 (#else) 分支 vcn 未初始化即检查（6.2+ 分支已修复），构建前打补丁
          perl -0777 -pi -e 's{(#else\n\t)/\* Validate lowest_vcn from on-disk metadata to ensure it is sane\. \*/}{$1vcn = le64_to_cpu(attr->data.non_resident.lowest_vcn);\n\t/* Validate lowest_vcn from on-disk metadata to ensure it is sane. */}' fs/ntfs/runlist.c
          grep -n "vcn = le64_to_cpu" fs/ntfs/runlist.c | head -2
          # GCC 14 对 linux-ntfs 等老代码更严格，关闭 CONFIG_WERROR 防止其他警告炸构建
          scripts/config --file out/.config -d WERROR
          make olddefconfig

      - name: 编译内核与设备树
        run: |
          # 防御：GKI 配置禁用模块（CONFIG_MODULES=n），即使 make_goals 误填 modules 也移除
          MAKE_GOALS="${MAKE_GOALS//modules/}"
          echo "make goals: $MAKE_GOALS"
          # 完整日志落盘，失败时随 artifact 上传，便于定位（并行构建输出可能被截断）。
          # 注意：Actions 的 bash 默认 -e -o pipefail，管道失败会直接终止脚本，
          # 必须用 "|| true" 承接管道状态，再通过 PIPESTATUS[0] 取 make 的退出码。
          make -j"$(nproc)" $MAKE_GOALS 2>&1 | tee build.log || true
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "=== 构建失败诊断 ==="
            echo "--- 磁盘空间 ---"; df -h / | tail -1
            echo "--- out 大小 ---"; du -sh out 2>/dev/null || true
            echo "--- 日志最后 50 行 ---"; tail -50 build.log
            echo "=== 用 V=1 增量重跑以捕获详细错误（已编译对象不重编）==="
            make V=1 -j"$(nproc)" $MAKE_GOALS 2>&1 | tee -a build.log || true
            RC2=${PIPESTATUS[0]}
            echo "=== V=1 重跑退出码: $RC2 ==="
            echo "--- V=1 日志最后 80 行 ---"; tail -80 build.log
            # 若 V=1 重跑成功（偶发失败自愈）则放行，产物完整性由收集产物步骤校验
            RC=$RC2
          fi
          exit $RC

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          # 相对路径（基于工作区），YAML with 中不做 shell 变量展开
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集产物
        run: |
          set -euo pipefail
          OUTDIR="kernel-out"
          mkdir -p "$OUTDIR"
          # 本内核 Makefile 设置了 KBUILD_OUTPUT=out，所有产物都在 out/ 下
          KREL=$(cat out/include/config/kernel.release)
          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"
          echo "kernel release: $KREL"

          # 内核镜像
          cp -v out/arch/arm64/boot/Image "$OUTDIR/Image" 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image.lz4 "$OUTDIR/Image.lz4" 2>/dev/null || true
          cp -v out/arch/arm64/boot/Image.gz "$OUTDIR/Image.gz" 2>/dev/null || true
          cp -v out/System.map "$OUTDIR/System.map" 2>/dev/null || true

          # 设备树：本内核 Makefile 定制 dtstree，产物在 out/google-devices/<device>/dts/
          # （base+overlay 静态合成的 dtb，含 DTC 的 -@ overlay 应用）
          if find out -name '*.dtb' 2>/dev/null | grep -q .; then
            tar -czf "$OUTDIR/dtbs.tar.gz" $(find out -name '*.dtb')
          fi

          # 内核模块（GKI 配置禁用模块，正常情况下不存在，仅作兜底）
          if [ -d "_modinst/lib/modules/$KREL" ]; then
            tar -czf "$OUTDIR/modules.tar.gz" -C _modinst/lib/modules "$KREL"
          fi

          # 调试符号（可选）
          if [ "${{ inputs.upload_vmlinux || 'false' }}" = "true" ]; then
            cp -v out/vmlinux "$OUTDIR/vmlinux"
          fi

          # 产物完整性校验：内核镜像未生成则视为失败（防止空产物假成功）
          if [ ! -f "$OUTDIR/Image" ] && [ ! -f "$OUTDIR/Image.lz4" ]; then
            echo "ERROR: 内核镜像未生成，构建未完成"
            exit 1
          fi

          ls -lh "$OUTDIR"

      - name: 打包 vendor_dlkm（模块分区镜像）
        run: |
          set -euo pipefail
          KREL=$(cat out/include/config/kernel.release)
          # google-modules 等外部模块（obj-m 硬编码，与 CONFIG_MODULES 无关）编译产物为 .ko，
          # 刷机时必须连模块一起刷入 vendor_dlkm 分区，否则显示/GPU 等驱动缺失。
          MODDIR="dlkm_root/lib/modules/$KREL"
          mkdir -p "$MODDIR"
          find out -name '*.ko' -exec cp {} "$MODDIR/" \;
          KO_COUNT=$(ls "$MODDIR"/*.ko 2>/dev/null | wc -l)
          echo "模块数量: $KO_COUNT"
          if [ "$KO_COUNT" -eq 0 ]; then
            echo "WARNING: 无 .ko 模块产物"
            exit 0
          fi
          # modules.load（init 按此加载模块）
          ls "$MODDIR"/*.ko | xargs -n1 basename | sed 's/\.ko$//' > "$MODDIR/modules.load"
          # modules.dep（depmod）
          depmod -b dlkm_root "$KREL" 2>/dev/null || true
          # 打包 ext4 镜像（256MB，模块通常几十 MB）
          truncate -s 256M vendor_dlkm.img
          mkfs.ext4 -q -L vendor_dlkm -d dlkm_root vendor_dlkm.img
          ls -lh vendor_dlkm.img
          cp vendor_dlkm.img kernel-out/vendor_dlkm.img

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          # 内核镜像：Pixel GKI boot 的 kernel 段为 Image.lz4，AK3 中命名为 zImage
          if [ -f out/arch/arm64/boot/Image.lz4 ]; then
            cp out/arch/arm64/boot/Image.lz4 AK3/zImage
          else
            cp out/arch/arm64/boot/Image AK3/zImage
          fi
          # dtb：本内核编译出的全部设备树（dtstree 产物在 out/google-devices/<device>/dts/，
          # base+overlay 静态合成）拼接为 dtb.img。
          # 关键：卡 logo 通常是因为用了别的内核的 dtb，这里必须用本内核的 dtb。
          find out -name '*.dtb' -exec cat {} + > AK3/dtb.img
          ls -lh AK3/zImage AK3/dtb.img
          # Pixel Tensor (GKI 2.0) 刷机配置
          cat > AK3/anykernel.sh <<'EOF'
          #!/sbin/sh
          #####################
          # Custom kernel (AnyKernel3) for Pixel Tensor (GKI 2.0)
          #####################
          ui_print "  ";
          ui_print "  Installing custom kernel for Pixel Tensor...";
          ui_print "  ";
          is_slot_device=auto;
          block=boot;
          is_slot_device=1;
          dtb=dtb.img;
          dump_boot;
          write_boot;
          EOF
          chmod +x AK3/anykernel.sh
          # 打包（保留 AK3 的 META-INF/tools，排除 git）
          rm -rf AK3/.git
          cd AK3 && zip -r9 ../kernel-ak3.zip . >/dev/null && cd ..
          ls -lh kernel-ak3.zip

      - name: 上传 AnyKernel3 包
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ak3
          path: kernel-ak3.zip
          if-no-files-found: error
          retention-days: 14

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.KERNEL_RELEASE }}
          path: kernel-out/
          if-no-files-found: error
          retention-days: 14
